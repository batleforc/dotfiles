[containers]
env = ["BUILDAH_FORMAT=docker"]
label = false
# `userns = "keep-id"` lived here and mapped exactly one ID (1000:0:1), which any
# image that chowns its own data directory cannot survive — postgres:17-alpine fails
# in initdb with "could not change permissions of directory". Removed rather than
# narrowed: /etc/subuid gives max:524288:65536, so podman's default maps container
# root to this uid plus 65536 sub-ids, which is what those images expect.
# Still available per command where it is actually wanted: `podman run --userns=keep-id`.